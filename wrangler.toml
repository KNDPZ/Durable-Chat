name = "durable-chat"
main = "worker.mjs"
compatibility_date = "2025-09-01"

# Static client (like Tongits)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub", "ChatRoom"]
