name = "durable-chat"
main = "worker.mjs"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/app", "/app.html", "/api/*", "/ws/*", "/avatar/*"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ChatRoom"

# Profile pictures — create bucket once: npx wrangler r2 bucket create durable-chat-avatars
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "durable-chat-avatars"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub", "ChatRoom"]
