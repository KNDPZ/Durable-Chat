<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Durable Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root,[data-theme=dark]{--bg:#0c0e14;--surface:#14171f;--surface2:#1c2030;--border:#2a3042;--text:#e8eaf2;--muted:#8b93a7;--accent:#6366f1;--accent-h:#818cf8;--success:#22c55e;--danger:#ef4444}
[data-theme=light]{--bg:#f4f5f9;--surface:#fff;--surface2:#f0f1f6;--border:#dde1ec;--text:#1a1d27;--muted:#6b7280;--accent:#4f46e5}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select{font-family:inherit;font-size:.95rem}button{cursor:pointer;border:none;border-radius:8px;font-weight:500}
.btn{background:var(--accent);color:#fff;padding:10px 18px}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5}
.btn-ghost{background:transparent;color:var(--muted);padding:8px 12px}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff;padding:8px 14px}.btn-sm{padding:6px 12px;font-size:.82rem}
input,select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);width:100%;outline:none}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50}
.logo{font-weight:700;font-size:1.15rem}.logo span{color:var(--accent)}
.topbar-right{display:flex;gap:8px;align-items:center;position:relative}
.gear-btn{width:40px;height:40px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center}
.dropdown{position:absolute;top:48px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:200px;display:none;overflow:hidden;z-index:100;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dropdown.open{display:block}.dropdown-item{display:block;width:100%;text-align:left;padding:12px 16px;background:none;border:none;color:var(--text);font-size:.9rem}
.dropdown-item:hover{background:var(--surface2)}.dropdown-divider{height:1px;background:var(--border);margin:4px 0}
.main{max-width:960px;margin:0 auto;padding:24px 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
.section-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.item:last-child{border-bottom:none}.item:hover{background:var(--surface2)}
.badge{font-size:.7rem;padding:3px 8px;border-radius:999px;font-weight:500}
.badge-public{background:rgba(34,197,94,.15);color:#4ade80}.badge-registered{background:rgba(99,102,241,.15);color:#a5b4fc}
.badge-private{background:rgba(239,68,68,.12);color:#f87171}.badge-friend{background:rgba(234,179,8,.15);color:#fbbf24}
.badge-admin{background:rgba(168,85,247,.15);color:#c084fc}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;margin-right:6px;box-shadow:0 0 6px var(--success)}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}.tab{padding:8px 14px;border-radius:8px;background:transparent;color:var(--muted)}.tab.active{background:var(--surface2);color:var(--text)}
.sub-tabs{display:flex;gap:4px;margin-bottom:12px}.sub-tab{padding:6px 12px;border-radius:6px;background:transparent;color:var(--muted);font-size:.85rem}.sub-tab.active{background:var(--surface2);color:var(--text)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.error-banner{background:rgba(239,68,68,.12);color:#fca5a5;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:none}
.chat-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.messages{height:400px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;background:var(--surface2);font-size:.92rem}.msg.mine{align-self:flex-end;background:rgba(99,102,241,.2)}
.msg .meta{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.chat-input{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border)}.chat-input input{flex:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:680px}.modal h2{margin-bottom:8px}.modal p{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.modal label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}.field{margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.secret-box{background:var(--surface2);border:1px dashed var(--border);border-radius:8px;padding:12px;font-family:monospace;font-size:.85rem;word-break:break-all;margin:12px 0}
#qrcode,#recoverQr{display:flex;justify-content:center;margin:16px 0}
.degree-option{display:block;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer}
.degree-option.selected,.degree-option:hover{border-color:var(--accent);background:rgba(99,102,241,.08)}
.degree-option input{width:auto;margin-right:8px}.degree-desc{font-size:.8rem;color:var(--muted);margin:4px 0 0 24px}
.member-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);padding:4px 10px;border-radius:999px;font-size:.8rem;margin:2px}
.user-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);padding:4px 10px;border-radius:999px;font-size:.85rem}
.contact-actions{display:flex;gap:6px}.blurred{filter:blur(4px);user-select:none}
.history-msg{padding:10px 0;border-bottom:1px solid var(--border);font-size:.88rem}.history-meta{font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Durable<span>Chat</span></div>
  <div class="topbar-right">
    <span id="userChip" class="user-chip" style="display:none"></span>
    <button class="gear-btn" id="gearBtn">⚙</button>
    <div class="dropdown" id="dropdown">
      <button class="dropdown-item" id="themeToggle"><span id="themeIcon">🌙</span> <span id="themeLabel">Light mode</span></button>
      <div class="dropdown-divider"></div>
      <button class="dropdown-item" id="authBtn">Log in / Register</button>
      <button class="dropdown-item" id="logoutBtn" style="display:none;color:var(--danger)">Log out</button>
    </div>
  </div>
</div>
<div class="main">
  <div class="error-banner" id="errorBanner"></div>
  <div id="view-home">
    <div class="tabs">
      <button class="tab active" data-tab="rooms">Rooms</button>
      <button class="tab" data-tab="contacts">Contacts</button>
      <button class="tab" data-tab="search">Search</button>
      <button class="tab" data-tab="admin" id="adminTab" style="display:none">Admin</button>
    </div>
    <div id="panel-rooms">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="section-title" style="margin:0">Public rooms</div>
        <button class="btn btn-sm" id="createRoomBtn" style="display:none">+ Create room</button>
      </div>
      <div class="card" id="publicRooms"><div class="empty">Loading…</div></div>
      <div id="privateSection" style="display:none;margin-top:24px">
        <div class="section-title">Your private rooms</div>
        <div class="card" id="privateRooms"></div>
      </div>
    </div>
    <div id="panel-contacts" style="display:none">
      <div class="section-title">Contacts & friends</div>
      <div class="card" id="contactsList"><div class="empty">Login to see contacts</div></div>
    </div>
    <div id="panel-search" style="display:none">
      <div class="field" style="margin-bottom:16px"><input id="searchInput" placeholder="Search users…"/></div>
      <div class="card" id="searchResults"><div class="empty">Type to search</div></div>
    </div>
    <div id="panel-admin" style="display:none">
      <div class="sub-tabs">
        <button class="sub-tab active" data-admin="online">Online</button>
        <button class="sub-tab" data-admin="users">All users</button>
        <button class="sub-tab" data-admin="admins">Admins</button>
        <button class="sub-tab" data-admin="lookup">Lookup</button>
      </div>
      <div id="admin-online" class="card"><div class="empty">Loading…</div></div>
      <div id="admin-users" class="card" style="display:none"></div>
      <div id="admin-admins" class="card" style="display:none"></div>
      <div id="admin-lookup" style="display:none">
        <div class="field" style="margin-bottom:16px"><input id="adminSearchInput" placeholder="Search username…"/></div>
        <div class="card" id="adminSearchResults"><div class="empty">Type to search</div></div>
      </div>
    </div>
  </div>
  <div id="view-room" style="display:none">
    <div class="card">
      <div class="chat-header">
        <button class="btn-ghost" id="backBtn">← Back</button>
        <div><strong id="roomName"></strong> <span id="roomBadge" class="badge"></span></div>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="btn-ghost btn-sm" id="manageMembersBtn" style="display:none">Members</button>
          <button class="btn-danger btn-sm" id="deleteRoomBtn" style="display:none">Delete</button>
        </div>
      </div>
      <div id="membersBar" style="display:none;padding:8px 16px;border-bottom:1px solid var(--border)"></div>
      <div class="messages" id="messages"></div>
      <div class="chat-input" id="chatInputRow">
        <input id="msgInput" placeholder="Type a message…" maxlength="2000"/>
        <button class="btn" id="sendBtn">Send</button>
      </div>
      <div id="loginToChat" style="display:none;padding:16px;text-align:center;color:var(--muted)">Log in to chat</div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="authModal" style="display:none"><div class="modal">
  <h2 id="authTitle">Welcome</h2><p id="authDesc"></p>
  <div id="authStep-choice">
    <button class="btn" style="width:100%;margin-bottom:10px" id="showLogin">Log in</button>
    <button class="btn-ghost" style="width:100%;border:1px solid var(--border)" id="showRegister">Create account</button>
  </div>
  <div id="authStep-login" style="display:none">
    <div class="field"><label>Username</label><input id="loginUsername"/></div>
    <div class="field"><label>Authenticator code</label><input id="loginCode" maxlength="6" inputmode="numeric"/></div>
    <div class="modal-actions"><button class="btn-ghost" id="backToChoice1">Back</button><button class="btn" id="doLogin">Log in</button></div>
  </div>
  <div id="authStep-register-user" style="display:none">
    <div class="field"><label>Username</label><input id="regUsername" placeholder="3-20 chars a-z 0-9 _"/></div>
    <div class="modal-actions"><button class="btn-ghost" id="backToChoice2">Back</button><button class="btn" id="checkUsername">Continue</button></div>
  </div>
  <div id="authStep-register-totp" style="display:none">
    <p>Scan with Google Authenticator / Authy / etc.</p>
    <div id="qrcode"></div>
    <div class="secret-box" id="secretText"></div>
    <div class="field"><label>6-digit code</label><input id="regCode" maxlength="6" inputmode="numeric"/></div>
    <div class="modal-actions"><button class="btn-ghost" id="backToUser">Back</button><button class="btn" id="completeReg">Create account</button></div>
  </div>
</div></div>

<div class="modal-backdrop" id="createRoomModal" style="display:none"><div class="modal">
  <h2>Create a room</h2>
  <div class="field"><label>Name</label><input id="newRoomName" maxlength="60"/></div>
  <div class="field"><label>Visibility</label>
    <select id="newRoomVis">
      <option value="public">Public</option>
      <option value="registered">Registered only (blurred for guests)</option>
      <option value="private">Private (invite-only)</option>
    </select>
  </div>
  <div id="privateOpts" style="display:none">
    <div class="field"><label>Who can be invited?</label>
      <label class="degree-option selected"><input type="radio" name="inviteDegree" value="contacts" checked/> Only contacts
        <div class="degree-desc">Only people already in the adder's contact list.</div></label>
      <label class="degree-option"><input type="radio" name="inviteDegree" value="contacts_of_contacts"/> Contacts of contacts
        <div class="degree-desc">Contacts, or contacts of those contacts (2 degrees).</div></label>
      <label class="degree-option"><input type="radio" name="inviteDegree" value="all"/> Anyone
        <div class="degree-desc">Any registered user on the platform.</div></label>
    </div>
    <div class="field"><label style="display:flex;gap:8px;align-items:center;cursor:pointer">
      <input type="checkbox" id="allowMembersInvite" style="width:auto"/> Allow members to invite others
    </label></div>
    <div class="field"><label>Add contacts now</label>
      <div id="createMemberPicker" style="max-height:140px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px"></div>
    </div>
  </div>
  <div class="modal-actions"><button class="btn-ghost" id="cancelCreateRoom">Cancel</button><button class="btn" id="doCreateRoom">Create</button></div>
</div></div>

<div class="modal-backdrop" id="membersModal" style="display:none"><div class="modal">
  <h2>Members</h2>
  <div id="membersList"></div>
  <div class="field" style="margin-top:16px"><label>Add from contacts</label>
    <div id="addMemberPicker" style="max-height:160px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px"></div>
  </div>
  <div class="modal-actions"><button class="btn-ghost" id="closeMembers">Close</button></div>
</div></div>

<div class="modal-backdrop" id="adminUserModal" style="display:none"><div class="modal wide">
  <h2 id="adminUserTitle">User</h2><p id="adminUserMeta"></p>
  <div id="adminUserActions" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"></div>
  <div class="section-title">Contacts</div><div id="adminContacts" class="card" style="max-height:140px;overflow:auto"></div>
  <div class="section-title" style="margin-top:12px">Message history</div><div id="adminHistory" class="card" style="max-height:240px;overflow:auto;padding:12px 16px"></div>
  <div class="modal-actions"><button class="btn-ghost" id="closeAdminUser">Close</button></div>
</div></div>

<div class="modal-backdrop" id="recoverModal" style="display:none"><div class="modal">
  <h2>Account recovery</h2>
  <p>New secret for <strong id="recoverUsername"></strong></p>
  <div id="recoverQr"></div>
  <div class="secret-box" id="recoverSecret"></div>
  <div class="modal-actions"><button class="btn" id="closeRecover">Done</button></div>
</div></div>

<script src="/app.js"></script>
</body>
</html>
