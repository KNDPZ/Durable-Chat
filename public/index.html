<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Durable Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0e1621;--surface:#17212b;--text:#f5f5f5;--muted:#708499;--accent:#2b5278;--accent-hi:#5288c1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border-radius:16px;padding:40px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.logo{font-size:1.75rem;font-weight:700;margin-bottom:8px}
.logo span{color:var(--accent-hi)}
.tagline{color:var(--muted);font-size:.95rem;margin-bottom:28px;line-height:1.5}
.ad{font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);line-height:1.8}
.ad strong{color:var(--text);font-weight:600}
.btn{display:block;width:100%;padding:12px 18px;border:none;border-radius:10px;font-weight:600;font-size:.95rem;cursor:pointer;margin-bottom:10px;font-family:inherit}
.btn-primary{background:var(--accent-hi);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12)}
.btn-ghost:hover{background:rgba(255,255,255,.05)}
.rooms{text-align:left;margin-top:20px;max-height:220px;overflow-y:auto}
.rooms h3{font-size:.75rem;text-transform:uppercase;color:var(--muted);margin-bottom:8px;letter-spacing:.06em}
.room{padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.2);margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.room:hover{background:rgba(82,136,193,.15)}
.room-name{font-weight:500}
.badge{font-size:.7rem;color:var(--accent-hi)}
.empty{color:var(--muted);font-size:.9rem;padding:12px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Durable<span>Chat</span></div>
  <p class="tagline">Secure messaging for your team.</p>
  <button class="btn btn-primary" id="goApp">Log in / Register</button>
  <button class="btn btn-ghost" id="showPublic">View public rooms</button>
  <div class="rooms" id="publicRooms" style="display:none"></div>
  <div class="ad">
    <strong>Private conversation</strong><br/>
    NO LOGS policy<br/>
    Total privacy
  </div>
</div>
<script>
document.getElementById("goApp").onclick = () => { location.href = "/app.html"; };
document.getElementById("showPublic").onclick = async () => {
  const box = document.getElementById("publicRooms");
  box.style.display = "block";
  box.innerHTML = "<div class='empty'>Loading…</div>";
  try {
    const res = await fetch("/api/public-rooms");
    const rooms = await res.json();
    if (!rooms.length) { box.innerHTML = "<div class='empty'>No public rooms yet</div>"; return; }
    box.innerHTML = "<h3>Public rooms</h3>" + rooms.map(r =>
      `<div class="room" data-id="${r.id}"><span class="room-name">${r.name.replace(/</g,"&lt;")}</span><span class="badge">public</span></div>`
    ).join("");
    box.querySelectorAll(".room").forEach(el => {
      el.onclick = () => { location.href = "/app.html?room=" + encodeURIComponent(el.dataset.id); };
    });
  } catch {
    box.innerHTML = "<div class='empty'>Could not load rooms</div>";
  }
};
// If already logged in, go to app
if (localStorage.getItem("dc_token")) location.href = "/app.html";
</script>
</body>
</html>
